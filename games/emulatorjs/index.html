<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Jev Atari</title>
<style>html,body{width:100%;height:100%;margin:0;background:black}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
#play-area{display:flex;flex:1;min-height:0}#game{flex:1;min-width:0;min-height:0}.ejs_menu_bar{display:none!important}
#metrics{width:36ch;flex:none;padding:12px;margin:0;box-sizing:border-box;overflow:auto;color:#a9edb6;background:#141927;font:12px/1.4 monospace;white-space:pre-wrap}
@media(max-width:800px){#play-area{flex-direction:column}#metrics{width:100%;max-height:28dvh;font-size:11px}}
#status{flex:none;min-height:48px;color:white;font:14px monospace;padding:8px;box-sizing:border-box;overflow-wrap:anywhere}
button{min-height:36px;margin:4px}</style>
<div id="play-area"><div id="game"></div><pre id="metrics">[ WAITING FOR START ]
Live Jev gates and counters will appear here.</pre></div>
<div id="status">Loading EmulatorJS…</div>
<canvas id="tracking" style="position:fixed;pointer-events:none;z-index:9999"></canvas>
<script src="/live-controls.js"></script>
<script>
// The core letterboxes INSIDE its canvas. CSS canvas bounds alone are not
// the game rectangle. WebGL's viewport is in backing pixels, bottom-left origin.
window.trackingTransform = () => {
    const source=document.querySelector('canvas.ejs_canvas');
    if(!source)return null;
    const gl=source.getContext('webgl2')||source.getContext('webgl');
    if(!gl||gl.isContextLost()||Number(EJS_emulator.getSettingValue('videoRotation')||0)!==0)return null;
    const r=source.getBoundingClientRect(),v=Array.from(gl.getParameter(gl.VIEWPORT));
    if(!source.width||!source.height||!r.width||!r.height||v[2]<=0||v[3]<=0)return null;
    const sx=r.width/source.width,sy=r.height/source.height;
    return {canvas_rect:{left:r.left,top:r.top,width:r.width,height:r.height},
        content_rect:{left:r.left+v[0]*sx,top:r.top+(source.height-v[1]-v[3])*sy,width:v[2]*sx,height:v[3]*sy},
        backing_size:[source.width,source.height],gl_viewport:v,method:'webgl-viewport'};
};
window.drawTracking = observation => {
    window.lastTracking=observation;
    const source=document.querySelector('canvas.ejs_canvas');
    if(!source)return;
    const overlay=document.getElementById('tracking'),transform=window.trackingTransform();
    const stale=observation.capture_frame!=null&&EJS_emulator.gameManager.getFrameNum()-observation.capture_frame>18;
    overlay.hidden=!transform||stale;
    if(stale)return;
    if(!transform)return;
    const r=transform.content_rect;
    overlay.style.left=r.left+'px';overlay.style.top=r.top+'px';
    const dpr=window.devicePixelRatio||1;
    overlay.style.width=r.width+'px';overlay.style.height=r.height+'px';
    overlay.width=Math.round(r.width*dpr);overlay.height=Math.round(r.height*dpr);
    const dimensions=observation.source_size||[160,210];
    const ctx=overlay.getContext('2d'),sx=r.width/dimensions[0],sy=r.height/dimensions[1];
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.font='12px monospace';
    for(const [role,items,color] of [['alien',observation.aliens||[],'#ffcc44'],['player',observation.player?[observation.player]:[],'#44ff88'],['laser',observation.projectiles||[],'#55ccff']]){
        ctx.strokeStyle=color;ctx.fillStyle=color;
        for(const item of items){const [x,y,x2,y2]=item.box;ctx.strokeRect(x*sx,y*sy,(x2-x+1)*sx,(y2-y+1)*sy);ctx.fillText(observation.labels?.[role]||role,x*sx,y*sy-3);}
    }
    ctx.strokeStyle='#ee88ff';
    for(const target of observation.targets||[]){const [x,y,x2,y2]=target.box;ctx.strokeRect(x*sx,y*sy,(x2-x+1)*sx,(y2-y+1)*sy);}
    for(const bug of observation.bug_tracks||[]){
        if(bug.vy==null)continue;ctx.strokeStyle='#ffaa44';ctx.setLineDash([4,4]);
        ctx.beginPath();ctx.moveTo(bug.x*sx,bug.y*sy);ctx.lineTo((bug.x+(bug.vx||0)*30)*sx,(bug.y+bug.vy*30)*sy);ctx.stroke();ctx.setLineDash([]);
    }
    for(const laser of observation.projectile_motion||[]){
        if(laser.vy==null)continue;
        ctx.strokeStyle=laser.direction==='down'?'#ff6666':'#55ccff';ctx.setLineDash([4,4]);
        ctx.beginPath();ctx.moveTo(laser.x*sx,laser.y*sy);
         ctx.lineTo(laser.x*sx,Math.max(0,Math.min(dimensions[1],laser.y+laser.vy*30))*sy);ctx.stroke();ctx.setLineDash([]);
    }
};
const redraw=()=>{if(window.lastTracking)window.drawTracking(window.lastTracking);};
window.addEventListener('resize',redraw);document.addEventListener('fullscreenchange',redraw);
new ResizeObserver(redraw).observe(document.getElementById('game'));
// A paused resize may update WebGL after the DOM resize event. Reproject on
// renderer callbacks as well; never change the native observation coordinates.
const trackAnimation=()=>{redraw();requestAnimationFrame(trackAnimation);};
requestAnimationFrame(trackAnimation);
</script>
<script>
window.EJS_player = '#game';
window.EJS_core = 'atari2600';
window.EJS_gameUrl = '/rom.a26';
window.EJS_pathtodata = '/data/';
window.EJS_startOnLoaded = true;
window.EJS_DEBUG_XX = true;
window.EJS_threads = false;
window.EJS_volume = 0;
window.EJS_askBeforeExit = false;
window.EJS_disableLocalStorage = true;
window.EJS_onGameStart = () => { EJS_emulator.pause(); window.started = true; };
</script><script src="/data/loader.js"></script></html>
